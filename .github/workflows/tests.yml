name: Тесты

# Обычная проверка тестов, отдельно от agent-merge.yml (тот только сливает ветки agent/...).
# Запускается при изменениях в main и в рабочих ветках, на запросы на слияние,
# раз в неделю по расписанию и вручную из вкладки Actions.
# Коммиты, которые делает сам бот слияния, другие workflow не запускают (так устроен
# GITHUB_TOKEN), поэтому расписание нужно, чтобы значок в README отражал свежий main.
on:
  push:
    branches: ['main', 'work/**']
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 это нижняя версия из README, 3.12 текущая
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Командная строка без ключа
        run: |
          python -m token_counter models
          python -m token_counter cost --model claude-sonnet-4-6 --input 1200 --output 300 --times 1000

      - name: Установка как пакета
        # Ставим из другой папки, чтобы импорт шёл из установленного пакета, а не из исходников:
        # так видно, что prices.json попал в пакет (без него promptdiff не посчитает цену)
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          token-counter models
          python -c "from token_counter import load_prices; assert load_prices()"
