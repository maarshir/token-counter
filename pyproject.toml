[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-counter"
version = "0.1.0"
description = "Подсчёт токенов и стоимости запросов к языковым моделям: таблица цен с датой и источником, точная денежная арифметика"
readme = "README.md"
requires-python = ">=3.10"
# httpx нужен только для точного подсчёта через count_tokens,
# но импортируется при загрузке командной строки, поэтому обязателен.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
token-counter = "token_counter.cli:main"

[project.urls]
Source = "https://github.com/maarshir/token-counter"

[tool.setuptools]
packages = ["token_counter"]

[tool.setuptools.package-data]
# Без этого таблица цен не попадёт в установленный пакет, и load_prices() упадёт
token_counter = ["prices.json"]
